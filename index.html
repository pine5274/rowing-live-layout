<!DOCTYPE html>
<html lang='ja'>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BraceBracket</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://api.fontshare.com/css?f[]=satoshi@1,2&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
</head>

<body>
  <img class='board' src="image/bg.png" alt=""> <!-- スコアボードのデザインの画像 -->
  <p id="race-info" class="race-info"></p>
  <p id="lane-1" class="lane lane-one"></p>
  <p id="lane-2" class="lane lane-two"></p>
  <p id="lane-3" class="lane lane-three"></p>
  <p id="lane-4" class="lane lane-four"></p>
  <p id="lane-5" class="lane lane-five"></p>
  <p id="lane-6" class="lane lane-six"></p>
  <p id="lane" class="lane-2"></p>
  <p class="local-setting">Local Time<br>JST</p>
  <p id="local-time" class="local-time"></p>
</body>
<script>
  const endpoint = "info.json";
  const point = "https://script.google.com/macros/s/AKfycbw3sXeqPDRPIjpkMmkBlAviya1C82UIprzQRMX31am4-vVVbrOQvAj9_x9tIj6m9jiuLg/exec";

  // APIからデータを取得して更新
  async function fetchScore() {
    try {
      const response = await fetch(endpoint);
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      const data = await response.json();
      updateScoreboard(data[0]);
    } catch (error) {
      console.error("Failed to fetch score data:", error);
    }
  }

  async function fetchScoreFromPoint() {
    try {
      const response = await fetch(point);
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      const data = await response.json();
      // 取得した配列を使ってスコアボードを更新
      updateScoreboardFromPoint(data);
    } catch (error) {
      console.error("Failed to fetch score data from point:", error);
    }
  }

  // スコアボードを更新
  function updateScoreboardFromPoint(data) {
    document.getElementById("race-info").innerHTML = data[0].info;
    const lanesString = data.map(item => `${item["lane-number"]} ${item.team}`).join("&nbsp;&nbsp;&nbsp;&nbsp; ");
    document.getElementById("lane").innerHTML = lanesString;
    adjustFontSize();
  }

  // スコアボードを更新
  function updateScoreboard(data) {
    document.getElementById("race-info").innerHTML = data.info;
    const lanesString = data.lane.join("&nbsp;&nbsp;&nbsp;&nbsp; ");
    document.getElementById("lane").innerHTML = lanesString;
    adjustFontSize();
  }

  // 現在時刻を更新
  function updateTime() {
    const localTime = new Date();
    const hour = String(localTime.getHours()).padStart(2, '0');
    const min = String(localTime.getMinutes()).padStart(2, '0');
    document.getElementById("local-time").innerHTML = `${hour}:${min}`;
  }

  function adjustFontSize() {
      let fontSize = 30; // 初期フォントサイズ
      const lane = document.getElementById("lane");
      lane.style.fontSize = `${fontSize}px`;

      // 要素の幅を超えないようにフォントサイズを調整
      while (lane.scrollWidth > lane.offsetWidth && fontSize > 10) {
        fontSize -= 1;
        lane.style.fontSize = `${fontSize}px`;
      }
  }

  // 初期化
  function init() {
    // fetchScore();
    fetchScoreFromPoint();
    updateTime();
    // setInterval(fetchScore, 5000); // スコアを5秒ごとに更新
    setInterval(fetchScoreFromPoint, 5000); // スコアを5秒ごとに更新
    setInterval(updateTime, 3000); // 時刻を3秒ごとに更新
  }

  init();
</script>
</html>
